<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Happy Birthday, Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ============================================================
     SCREEN 1 — PASSWORD LOCK
     ============================================================ -->
<section id="lock-screen" class="screen active">
  <div class="lock-card">
    <p class="lock-eyebrow">for loveyy</p>
    <h1 class="lock-title">enter the code</h1>
    <div class="pin-dots" id="pinDots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <p class="lock-error" id="lockError">that's not it, try again mahal 🤍</p>

    <div class="numpad" id="numpad">
      <button class="num-btn" data-num="1">1</button>
      <button class="num-btn" data-num="2">2</button>
      <button class="num-btn" data-num="3">3</button>
      <button class="num-btn" data-num="4">4</button>
      <button class="num-btn" data-num="5">5</button>
      <button class="num-btn" data-num="6">6</button>
      <button class="num-btn" data-num="7">7</button>
      <button class="num-btn" data-num="8">8</button>
      <button class="num-btn" data-num="9">9</button>
      <button class="num-btn ghost" id="clearBtn">clear</button>
      <button class="num-btn" data-num="0">0</button>
      <button class="num-btn ghost" id="backBtn">⌫</button>
    </div>
  </div>
</section>

<!-- ============================================================
     SCREEN 2 — WORD REVEAL (plays favmusic.mp3 on unlock)
     ============================================================ -->
<section id="reveal-screen" class="screen">
  <div class="stars" aria-hidden="true"></div>
  <div class="reveal-word" id="revealWord"></div>
</section>

<!-- the blue curtain that rises up and "consumes" the reveal screen -->
<div id="blueCurtain" class="blue-curtain" aria-hidden="true"></div>

<!-- ============================================================
     SCREEN 3 — AESTHETIC BLUE INTRO / "swipe or click" PROMPT
     ============================================================ -->
<section id="intro-screen" class="screen">
  <div class="stars" aria-hidden="true"></div>
  <div class="intro-content">
    <p class="intro-kicker">happy birthday</p>
    <h2 class="intro-heading">loveyy nakoo</h2>
    <p class="intro-sub">i wrote you a little something. swipe through it whenever you're ready.</p>
    <button class="intro-cta" id="introCta">
      <span>swipe or tap here</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>

<!-- ============================================================
     SCREEN 4 — LETTER CARDS (swipeable)
     ============================================================ -->
<section id="letter-screen" class="screen">
  <div class="stars" aria-hidden="true"></div>

  <div class="letter-header">
    <span class="letter-progress-label" id="progressLabel">1 / 10</span>
  </div>

  <div class="card-stage" id="cardStage">
    <!-- Cards are generated by script.js from the letterContent array,
         so all text stays exactly as written. Each card also has an
         empty .card-image slot — see script.js for where to drop
         <img> tags in for each section. -->
  </div>

  <div class="progress-dots" id="progressDots"></div>

  <div class="swipe-hint" id="swipeHint">← swipe →</div>
</section>

<!-- ============================================================
     SCREEN 5 — CLOSING SCREEN
     ============================================================ -->
<section id="closing-screen" class="screen">
  <div class="stars" aria-hidden="true"></div>
  <div class="hearts" id="heartsLayer" aria-hidden="true"></div>
  <div class="closing-content">
    <p class="closing-pre">and that's it, love.</p>
    <h2 class="closing-title">happy birthday.<br>i love you always.</h2>
    <p class="closing-sign">— deym 🤍</p>
    <button class="closing-replay" id="replayBtn">read it again</button>
  </div>
</section>

<!-- background music, unmuted programmatically once the password is correct -->
<audio id="bgMusic" src="assets/music/favmusic.mp3" preload="auto"></audio>

<script src="js/script.js"></script>
</body>
</html>
